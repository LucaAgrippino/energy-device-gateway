name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5
    steps:
      - uses: actions/checkout@v4

      - name: Build firmware
        run: |
          . /opt/esp/idf/export.sh
          idf.py set-target esp32s3
          idf.py build

      # --output-format does not exist in idf.py v5.5; the option is --format.
      - name: Binary size report
        run: |
          . /opt/esp/idf/export.sh
          idf.py size --format json --output-file size-report.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/*.bin
            build/*.elf
            size-report.json

  lint:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5
    steps:
      - uses: actions/checkout@v4

      # The idf image ships no clang-tidy, and a stock one is no use here: it has
      # no Xtensa backend, rejects -mlongcalls, and cannot parse ESP-IDF headers
      # for a 32-bit target from an x86-64 host. Espressif's LLVM build can.
      - name: Install esp-clang
        run: |
          . /opt/esp/idf/export.sh
          python "$IDF_PATH/tools/idf_tools.py" install esp-clang

      - name: Generate compile_commands.json
        run: |
          . /opt/esp/idf/export.sh
          idf.py set-target esp32s3
          idf.py reconfigure

      # Only .cpp files are passed. Headers have no entry in the compile
      # database; they are covered through HeaderFilterRegex when a translation
      # unit includes them. test/ and host_test/ are built by separate projects
      # and likewise absent from this database.
      - name: Run clang-tidy
        run: |
          . /opt/esp/idf/export.sh
          python3 tools/ci/clang_tidy_db.py build build/tidy
          CLANG_TIDY=$(find "${IDF_TOOLS_PATH:-$HOME/.espressif}/tools/esp-clang" \
            -name clang-tidy -type f | head -1)
          echo "using $CLANG_TIDY"
          find components main -name '*.cpp' \
            -not -path '*/host_test/*' -not -path '*/test/*' -print0 | \
            xargs -0 "$CLANG_TIDY" -p build/tidy

  test:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5
    steps:
      - uses: actions/checkout@v4

      # ESP-IDF's linux port pulls <bsd/sys/cdefs.h> in through
      # components/linux/include/sys/cdefs.h, and the idf image does not ship it.
      - name: Install host-target dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq libbsd-dev

      # The linux target is gated behind --preview in v5.5. The host_test project
      # arrives with the aggregator component, so skip cleanly before then rather
      # than failing on a directory that does not exist yet.
      - name: Build and run host-based tests
        run: |
          . /opt/esp/idf/export.sh
          if [ ! -d components/aggregator/host_test ]; then
            echo "components/aggregator/host_test does not exist yet — nothing to run"
            exit 0
          fi
          cd components/aggregator/host_test
          idf.py --preview set-target linux
          idf.py build
          ./build/host_test_aggregator.elf
