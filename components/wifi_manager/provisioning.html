<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>energy-device-gateway — Wi-Fi setup</title>
<style>
  body { font-family: sans-serif; background: #111; color: #eee; display: flex;
         min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
  form { background: #1c1c1c; padding: 2rem; border-radius: 8px; width: 280px; }
  h1 { font-size: 1.1rem; margin-top: 0; }
  label { display: block; margin-top: 1rem; font-size: 0.85rem; color: #aaa; }
  input { width: 100%; box-sizing: border-box; padding: 0.5rem; margin-top: 0.25rem;
          border-radius: 4px; border: 1px solid #444; background: #000; color: #eee; }
  button { margin-top: 1.5rem; width: 100%; padding: 0.6rem; border: none; border-radius: 4px;
           background: #2d7dd2; color: white; font-size: 1rem; cursor: pointer; }
  button:hover { background: #1d63ad; }
  p.hint { font-size: 0.75rem; color: #777; margin-top: 1rem; }
</style>
</head>
<body>
<form action="/save" method="POST">
  <h1>Connect gateway to Wi-Fi</h1>
  <label for="ssid">Network name (SSID)</label>
  <input type="text" id="ssid" name="ssid" maxlength="32" required>
  <label for="password">Password</label>
  <input type="password" id="password" name="password" maxlength="64">
  <button type="submit">Save &amp; Restart</button>
  <p class="hint">The device will restart and connect to this network.</p>
</form>
</body>
</html>
